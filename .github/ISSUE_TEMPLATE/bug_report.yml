name: Bug report
description: Something in TicketLens does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you paste anything: redact your ticket text.** Logs and screenshots
        from this app routinely contain real support-ticket content.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load a workbook with ...
        2. Select columns ...
        3. Click RUN CLUSTERING
        4. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TicketLens version
      description: Help → About
      placeholder: "1.2.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - run.bat
        - Manual pip install
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        From `logs/`, the file matching the run that failed. **Redact ticket text first.**
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have removed all customer/ticket data from this report
          required: true
