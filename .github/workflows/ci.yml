# Runs the same two checks check.ps1 runs locally: ruff, then pytest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Lint needs nothing but ruff, so skip the multi-GB runtime install here.
      - run: pip install ruff==0.15.20
      - run: ruff check src tests main.py --output-format concise

      # run.sh only ever executes on macOS/Linux, so an edit made on Windows can
      # break it with nothing noticing. Parse it and lint it here.
      - name: Check run.sh
        run: |
          bash -n run.sh
          shellcheck --severity=warning run.sh

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the primary target and the platform run.bat ships on.
          - os: windows-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.12'
          # Linux covers the run.sh path; the suite is headless via offscreen Qt.
          - os: ubuntu-latest
            python-version: '3.12'
          # macOS arm64 is the other run.sh target with a prebuilt llama wheel.
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # PySide6 wheels bundle Qt but not its system dependencies; without these
      # the import fails with an unhelpful xcb platform-plugin error.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0

      # The same index run.bat and run.sh use, so llama-cpp-python installs
      # prebuilt rather than trying to compile on the runner.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            --only-binary llama-cpp-python

      # conftest.py sets this too, but be explicit: the runners have no display.
      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
