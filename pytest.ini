[pytest]
# Anchor imports at the repo root so tests can `import src....`
pythonpath = .
testpaths = tests
# --basetemp keeps pytest's working files in the repo tree so it avoids the
# LOCALAPPDATA\Temp\pytest-of-<user>\pytest-current symlink that Windows
# cannot create without Developer Mode, which caused exit code 1 on a fully
# passing suite.
addopts = -q --basetemp=.pytest_tmp
